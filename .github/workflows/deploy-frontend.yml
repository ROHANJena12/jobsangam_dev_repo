name: Deploy Frontend

on:
  push:
    branches: [ "frontend" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Run frontend deploy script
        run: bash /opt/deploy-frontend.sh

      - name: Health check frontend
        run: |
          echo "Waiting for frontend to boot..."
          sleep 10
          curl -fsS http://34.197.36.232 >/dev/null

